# Checks and tests. Publishing to GitHub Pages is added once the screen exists.
# External Actions are pinned to commit SHAs with the version beside them. Dependabot opens PRs to update them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # R-20 checks the authors of every commit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Check privacy
        run: npm run check:privacy
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
          # Passed as environment variables, not expanded into the shell (prevents command injection via the PR body)
          PR_TEXT: ${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test -- --passWithNoTests
